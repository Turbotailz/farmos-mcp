services:
  farmos-mcp:
    build: .
    image: farmos-mcp:0.1.0
    restart: unless-stopped
    env_file:
      - /DATA/AppData/farmos-mcp/dunslaw.env
    environment:
      FARMOS_MCP_HOST: "0.0.0.0"
      FARMOS_MCP_PUBLIC_URL: "https://farmos-mcp.dunslaw.com.au"
      FARMOS_MCP_STATE_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /DATA/AppData/farmos-mcp/state:/data
